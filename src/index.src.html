<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TARIFF WARS &#183; a supply chain boss fight</title>
<style>
@font-face{font-family:"PS";src:url(__PS2P__) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"SS";src:url(__SILK__) format("woff2");font-weight:400;font-display:block}
@font-face{font-family:"SS";src:url(__SILKB__) format("woff2");font-weight:700;font-display:block}

:root{
  --bg:#100b1e; --bg2:#1b1432; --bg3:#241a42;
  --frame:#43308a; --ink:#fcfcfc;
  --amber:#f8cc50; --amber2:#e8a010;
  --red:#f04a28; --red2:#c42020;
  --green:#58d854; --blue:#3ca0e8;
  --steel:#8c8ca8; --dim:#b0a4d8; --dim2:#7d70a8;
  --px:4px;
  --dith:none; --haz:none;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
body{
  font-family:"SS",monospace;color:var(--ink);
  image-rendering:pixelated;
  -webkit-font-smoothing:none;
  cursor:default;
}
svg{display:block;shape-rendering:crispEdges}

#crt{position:fixed;inset:0;pointer-events:none;z-index:900;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.30) 0 2px,transparent 2px 4px)}
#flash{position:fixed;inset:0;pointer-events:none;z-index:901;opacity:0;background:var(--ink)}
@keyframes fl{0%{opacity:.7}40%{opacity:0}70%{opacity:.35}100%{opacity:0}}
.flashing{animation:fl .26s steps(1,end) both}
@keyframes shk{
  0%,100%{transform:translate(0,0)} 12%{transform:translate(-12px,4px)}
  32%{transform:translate(10px,-6px)} 52%{transform:translate(-8px,4px)}
  74%{transform:translate(6px,-2px)} 90%{transform:translate(-3px,1px)}
}
.shake{animation:shk .42s steps(1,end) both}

#root{height:100%;display:flex;flex-direction:column;background:var(--bg);
  padding:var(--px);gap:var(--px)}

.pxb{position:relative;background:var(--bg2);
  box-shadow:0 calc(var(--px)*-1) 0 var(--frame),0 var(--px) 0 var(--frame),
             calc(var(--px)*-1) 0 0 var(--frame),var(--px) 0 0 var(--frame);
  margin:var(--px)}

/* ══════════ HUD ══════════ */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:calc(var(--px)*4);
  padding:calc(var(--px)*2.5) calc(var(--px)*4)}
#hud .co{font-family:"PS";font-size:clamp(8px,.9vw,13px);color:var(--amber);
  line-height:1.8;white-space:nowrap}
#hud .co i{display:block;color:var(--dim2);font-style:normal;font-size:.82em}
.stats{display:flex;gap:calc(var(--px)*3);flex:1;align-items:center;min-width:0}
.stat{flex:1;min-width:0;position:relative;padding:0 calc(var(--px)*2);
  border-left:var(--px) solid #2a1f52}
.stat:first-child{border-left:0}
.stat .top{display:flex;align-items:center;gap:calc(var(--px)*2);margin-bottom:calc(var(--px)*1.5)}
.stat .nm{font-family:"PS";font-size:clamp(7px,.84vw,12.5px);color:var(--dim2)}
.stat .vl{font-family:"PS";font-size:clamp(12px,1.42vw,23px);margin-left:auto}
.bar{display:flex;gap:2px;height:clamp(13px,1.5vw,24px)}
.seg{flex:1;background:#251b48;box-shadow:inset 0 0 0 2px #140e28}
.seg.on{background:var(--c,var(--green))}
/* damage numbers fall out of the HUD into the arena, so they never sit on the value */
.pop{position:absolute;right:calc(var(--px)*2);top:100%;font-family:"PS";z-index:5;
  font-size:clamp(11px,1.35vw,22px);pointer-events:none;opacity:0;text-shadow:3px 3px 0 #000}
@keyframes popup{0%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(30px)}}
.pop.go{animation:popup 1.15s steps(8,end) both}
#hudright{display:flex;flex-direction:column;gap:calc(var(--px)*1.5);align-items:flex-end;
  font-family:"PS";font-size:clamp(7px,.8vw,11px);color:var(--dim2);white-space:nowrap}
.pips{display:flex;gap:3px}
.pip{width:clamp(11px,1.2vw,18px);height:clamp(11px,1.2vw,18px);background:#251b48;
  box-shadow:inset 0 0 0 3px #140e28}
.pip.on{background:var(--amber2)} .pip.cur{background:var(--amber)}

/* ══════════ STAGE ══════════ */
#stage{flex:1 1 auto;position:relative;overflow:hidden;display:flex;flex-direction:column}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* arena: every texture here is a tiled pixel map, not a gradient */
.arena{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;
  min-height:0;overflow:hidden;background-color:var(--bg);
  background-image:var(--dith);background-size:32px 32px}
.arena .floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:var(--bg3);
  box-shadow:0 -4px 0 #2e2158}
.arena .floor::before{content:"";position:absolute;left:0;right:0;top:-16px;height:16px;
  background-image:var(--dith);background-size:32px 32px;background-color:transparent;
  filter:none;opacity:.9}
.arena.hazard::before{content:"";position:absolute;inset:0;
  background-image:var(--haz);background-size:64px 64px}
.boss{position:relative;display:flex;flex-direction:column;align-items:center;
  gap:calc(var(--px)*3);z-index:2}
@keyframes bob{0%,50%{transform:translateY(0)}51%,100%{transform:translateY(-8px)}}
.boss .art{animation:bob 1.6s steps(1,end) infinite}
@keyframes drop{0%{transform:translateY(-140%)}55%{transform:translateY(8%)}
  75%{transform:translateY(-4%)}100%{transform:translateY(0)}}
.boss.enter .art{animation:drop .42s steps(1,end) both}
.plate{font-family:"PS";text-align:center;line-height:1.6}
.plate b{display:block;font-size:clamp(15px,2.2vw,36px);color:var(--red);
  text-shadow:4px 4px 0 #000;letter-spacing:.02em}
.plate i{display:block;font-style:normal;font-size:clamp(7.5px,.88vw,13px);
  color:var(--dim2);margin-top:.75em}
.plate.b2 b{color:var(--blue)} .plate.b3 b{color:var(--amber)}

/* compact enemy strip on command screens */
.bossbar{flex:0 0 auto;display:flex;align-items:center;gap:calc(var(--px)*4);
  padding:calc(var(--px)*2) calc(var(--px)*5);background-color:var(--bg);
  background-image:var(--dith);background-size:32px 32px;position:relative}
.bossbar .plate{text-align:left}
.bossbar .plate b{font-size:clamp(13px,1.7vw,28px)}

/* ══════════ IMPACT BANNER (was a rotated CSS box, now a pixel banner) ══════════ */
.slamwrap{position:absolute;z-index:6;transform:scale(4);opacity:0;
  animation:slamin .3s steps(3,end) forwards}
@keyframes slamin{0%{transform:scale(4);opacity:0}
  33%{opacity:1;transform:scale(1.6)}66%{transform:scale(.88)}100%{transform:scale(1);opacity:1}}
.slam{font-family:"PS";text-align:center;line-height:1.5;
  background:#100b1e;padding:calc(var(--px)*3) calc(var(--px)*4);
  box-shadow:
    0 0 0 4px #100b1e,
    0 0 0 8px currentColor,
    0 0 0 12px #100b1e,
    12px 12px 0 12px rgba(0,0,0,.6);
}
.slam b{display:block;font-size:clamp(15px,2.1vw,34px)}
.slam i{display:block;font-style:normal;font-size:clamp(8px,1vw,15px);
  margin-top:.7em;color:var(--ink)}
.sg{color:var(--green)} .sr{color:var(--red)} .sa{color:var(--amber)} .sb{color:var(--blue)}

/* ══════════ dialog ══════════ */
.dlg{flex:0 0 auto;padding:calc(var(--px)*4) calc(var(--px)*5);min-height:28%;
  display:flex;flex-direction:column;justify-content:center;position:relative}
.dlg .who{font-family:"PS";font-size:clamp(8px,.92vw,13.5px);color:var(--amber);
  margin-bottom:calc(var(--px)*3)}
.dlg .txt{font-weight:700;font-size:clamp(17px,2.25vw,40px);line-height:1.45;
  max-width:66ch;min-height:2.9em}
.cursor{display:inline-block;width:.55em;height:.95em;background:var(--ink);
  vertical-align:-.1em;animation:bl .4s steps(1) infinite}
@keyframes bl{0%,50%{opacity:1}51%,100%{opacity:0}}
.next{position:absolute;right:calc(var(--px)*5);bottom:calc(var(--px)*3);
  font-family:"PS";font-size:clamp(10px,1.15vw,18px);color:var(--amber);
  animation:bl .6s steps(1) infinite}
.next.hide{display:none}

.chips{display:flex;gap:calc(var(--px)*2);flex-wrap:wrap;margin-top:calc(var(--px)*3)}
.chip{font-family:"PS";font-size:clamp(8px,.95vw,14px);padding:.55em .65em;
  background:#100b1e;box-shadow:0 0 0 3px currentColor;line-height:1}
.cup{color:var(--green)} .cdn{color:var(--red)} .cpd{color:var(--amber)} .cnu{color:var(--steel)}

/* ══════════ command menu ══════════ */
.menu{flex:1 1 auto;display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--px)*2);
  padding:calc(var(--px)*2);min-height:0}
.cmd{display:flex;gap:calc(var(--px)*3);align-items:flex-start;padding:calc(var(--px)*3.5);
  cursor:pointer;position:relative;background:var(--bg2);overflow:hidden;
  box-shadow:0 calc(var(--px)*-1) 0 var(--frame),0 var(--px) 0 var(--frame),
             calc(var(--px)*-1) 0 0 var(--frame),var(--px) 0 0 var(--frame);
  animation:cin .2s steps(3,end) both}
@keyframes cin{from{opacity:0}to{opacity:1}}
.cmd:hover,.cmd.sel{background:var(--bg3);

.cmd .key{font-family:"PS";font-size:clamp(13px,1.5vw,24px);background:var(--amber);
  color:#100b1e;padding:.45em .55em;line-height:1;flex:0 0 auto}
.cmd .ic{flex:0 0 auto;margin-top:2px}
.cmd .bd{flex:1;min-width:0;display:flex;flex-direction:column}
.cmd .t{font-family:"PS";font-size:clamp(11px,1.35vw,22px);color:var(--ink);line-height:1.3}
.cmd .d{font-weight:700;font-size:clamp(14px,1.72vw,29px);color:var(--dim);
  line-height:1.4;margin-top:.5em}
.cmd .st{display:flex;gap:calc(var(--px)*4);margin-top:auto;padding-top:calc(var(--px)*3);
  flex-wrap:wrap}
.cmd .st span{font-family:"PS";font-size:clamp(7.5px,.88vw,13px);color:var(--dim2)}
.cmd .st b{color:var(--amber)}
.menuhead{font-family:"PS";font-size:clamp(9px,1.08vw,17px);color:var(--amber);
  padding:calc(var(--px)*2.5) calc(var(--px)*5) 0;flex:0 0 auto}
.menuhead span{color:var(--dim2)}

/* ══════════ paths ══════════ */
.paths{flex:1;display:flex;flex-direction:column;padding:calc(var(--px)*2);min-height:0}
.paths h3{font-family:"PS";font-size:clamp(10px,1.2vw,19px);color:var(--amber);

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--px)*2);flex:1;min-height:0}
.pcard{background:var(--bg2);padding:calc(var(--px)*3.5);display:flex;flex-direction:column;
  gap:calc(var(--px)*2.5);overflow:hidden;
  box-shadow:0 calc(var(--px)*-1) 0 var(--frame),0 var(--px) 0 var(--frame),
             calc(var(--px)*-1) 0 0 var(--frame),var(--px) 0 0 var(--frame);
  animation:cin .22s steps(3,end) both}
.pcard .ph{display:flex;align-items:center;gap:calc(var(--px)*2.5)}
.pcard .pt{font-family:"PS";font-size:clamp(10px,1.18vw,19px)}
.pcard .ps{font-family:"PS";font-size:clamp(7.5px,.86vw,13px)}
.pcard .px{font-weight:700;font-size:clamp(14px,1.7vw,28px);line-height:1.4;color:var(--dim)}
.pcard .chips{margin-top:auto}

/* ══════════ text screens ══════════ */
.pad{padding:calc(var(--px)*4) calc(var(--px)*7);display:flex;flex-direction:column;
  height:100%;justify-content:center;gap:calc(var(--px)*4)}
h1{font-family:"PS";font-weight:400;font-size:clamp(22px,4.6vw,74px);line-height:1.3;
  text-shadow:6px 6px 0 var(--red2)}
h2{font-family:"PS";font-weight:400;font-size:clamp(14px,2.2vw,36px);line-height:1.45;
  color:var(--amber)}
.body{font-weight:700;font-size:clamp(16px,2.1vw,36px);line-height:1.45;max-width:64ch}
.body em{font-style:normal;color:var(--amber)}
.small{font-family:"PS";font-size:clamp(8px,.96vw,14.5px);color:var(--dim2);line-height:2.1}
.small b{color:var(--amber);font-weight:400}
.blink{animation:bl .6s steps(1) infinite}

.sup{display:flex;flex-direction:column;gap:calc(var(--px)*1.5)}
.sup .row{display:grid;grid-template-columns:auto 1.4fr 1fr .7fr;gap:calc(var(--px)*4);
  align-items:center;padding:calc(var(--px)*2.5) calc(var(--px)*4);background:var(--bg2)}
.sup .row.crit{background:#33132a;box-shadow:0 0 0 3px var(--red)}
.sup .row span{font-family:"PS";font-size:clamp(9px,1.08vw,17px);color:var(--dim2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sup .row span.a{color:var(--ink)}
.sup .row.crit span{color:var(--red)} .sup .row.crit span.a{color:var(--amber)}

.rankwrap{display:flex;gap:calc(var(--px)*7);align-items:center}
.rank{font-family:"PS";font-size:clamp(64px,12.5vw,200px);line-height:.9;
  text-shadow:8px 8px 0 var(--red2);flex:0 0 auto;
  animation:rin .36s steps(4,end) both}
@keyframes rin{0%{transform:scale(3.4);opacity:0}50%{opacity:1;transform:scale(1.3)}
  100%{transform:scale(1);opacity:1}}
.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--px)*2);
  margin:calc(var(--px)*3) 0}
.sc{background:var(--bg2);padding:calc(var(--px)*3.5);
  box-shadow:0 calc(var(--px)*-1) 0 var(--frame),0 var(--px) 0 var(--frame),
             calc(var(--px)*-1) 0 0 var(--frame),var(--px) 0 0 var(--frame)}
.sc .k{font-family:"PS";font-size:clamp(7.5px,.88vw,13px);color:var(--dim2)}
.sc .v{font-family:"PS";font-size:clamp(17px,2.7vw,44px);margin-top:.55em}
.sc .n{font-family:"PS";font-size:clamp(7px,.8vw,11.5px);color:var(--steel);margin-top:.75em}

.ck{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:calc(var(--px)*1.5)}
.ck>div{background:var(--bg2);padding:calc(var(--px)*3.5);font-family:"PS";
  font-size:clamp(9px,1.18vw,19px);line-height:1.5}
.ck .h{color:var(--dim2);font-size:clamp(8px,.94vw,14px)}
.ck .k2{color:var(--steel);font-size:clamp(8px,.96vw,14.5px)}
.ck .g{color:var(--green)} .ck .am{color:var(--amber)}

#ctrl{flex:0 0 auto;display:flex;gap:calc(var(--px)*5);align-items:center;
  padding:calc(var(--px)*2.5) calc(var(--px)*4);font-family:"PS";
  font-size:clamp(7px,.78vw,11px);color:#6a5f96;white-space:nowrap;overflow:hidden}
#ctrl kbd{background:#251b48;color:var(--dim2);padding:.4em .5em;margin-right:.5em;
  font-family:inherit}
#ctrl .sp{flex:1}

@media (max-width:820px){
  .menu{grid-template-columns:1fr} .pgrid{grid-template-columns:1fr}
  .ck{grid-template-columns:1fr} .rankwrap{flex-direction:column;align-items:flex-start}
}
</style>

<script>
"use strict";
__SPRITES__

/* ═══ sprite renderer ═══ */
function svgOf(rows,px){
  const w=rows[0].length,h=rows.length;
  let out="";
  for(let y=0;y<h;y++){
    const row=rows[y]; let x=0;
    while(x<w){
      const c=row[x];
      if(c==="."){x++;continue}
      let run=1; while(x+run<w&&row[x+run]===c) run++;
      out+=`<rect x="${x}" y="${y}" width="${run}" height="1" fill="${px[c]}"/>`;
      x+=run;
    }
  }
  return {w,h,body:out};
}
function spr(name,scale){
  const s=svgOf(SPR[name],PAL);
  return `<svg viewBox="0 0 ${s.w} ${s.h}" width="${s.w*scale}" height="${s.h*scale}" `+
         `xmlns="http://www.w3.org/2000/svg">${s.body}</svg>`;
}
/* background textures are generated pixel maps too, so nothing on screen is a gradient */
function tileURL(rows,pal){
  const s=svgOf(rows,pal);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s.w} ${s.h}" `+
            `width="${s.w}" height="${s.h}" shape-rendering="crispEdges">${s.body}</svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function checkerTile(size){
  const rows=[];
  for(let y=0;y<size;y++){
    let r="";
    for(let x=0;x<size;x++) r += ((x+y)%2===0) ? "A" : ".";
    rows.push(r);
  }
  return rows;
}
/* a real 45 degree staircase, one pixel of rise per pixel of run, seamless when tiled */
function stairTile(size,thick){
  const rows=[];
  for(let y=0;y<size;y++){
    let r="";
    for(let x=0;x<size;x++) r += (((x - y) % size + size) % size) < thick ? "A" : ".";
    rows.push(r);
  }
  return rows;
}

/* ═══ AUDIO ═══ */
let AC=null,SND=true;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){SND=false} } return AC }
function tone(f,d,o){
  o=o||{}; if(!SND) return; const c=ac(); if(!c) return;
  const t=c.currentTime+(o.delay||0);
  const osc=c.createOscillator(),g=c.createGain();
  osc.type=o.type||"square"; osc.frequency.setValueAtTime(f,t);
  if(o.to) osc.frequency.linearRampToValueAtTime(o.to,t+d);
  g.gain.setValueAtTime(o.v||.05,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t+d+.02);
}
function noise(d,v,delay){
  if(!SND) return; const c=ac(); if(!c) return;
  const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),dt=b.getChannelData(0);
  for(let i=0;i<n;i++) dt[i]=(Math.random()*2-1)*(1-i/n);
  const s=c.createBufferSource(),g=c.createGain();
  s.buffer=b; g.gain.value=v||.05; s.connect(g); g.connect(c.destination);
  s.start(c.currentTime+(delay||0));
}
const SFX={
  blip:function(){tone(660,.018,{v:.022})},
  pick:function(){tone(523,.06,{v:.06});tone(784,.09,{v:.06,delay:.06})},
  page:function(){tone(330,.05,{v:.035,type:"triangle"})},
  hurt:function(){tone(220,.28,{to:70,type:"sawtooth",v:.07});noise(.18,.05,0)},
  good:function(){tone(523,.07,{v:.055});tone(659,.07,{v:.055,delay:.07});tone(880,.13,{v:.055,delay:.14})},
  crit:function(){noise(.35,.09,0);tone(110,.4,{to:52,v:.09});tone(160,.3,{to:60,type:"sawtooth",v:.05,delay:.05})},
  boss:function(){tone(70,.55,{to:44,type:"sawtooth",v:.08});noise(.4,.06,0);tone(180,.2,{to:120,v:.05,delay:.25})},
  win:function(){[523,659,784,1047,784,1047].forEach(function(f,i){tone(f,.16,{v:.06,delay:i*.11})})},
  lose:function(){[392,349,294,220].forEach(function(f,i){tone(f,.28,{v:.06,type:"triangle",delay:i*.16})})}
};

/* ═══ STATE ═══ */
const START={cash:100,phones:100,risk:90,stocked:false,plusone:false,quit:false,picks:[]};
let S,step,hist;
const MENUOPTS={};

/* ═══ CONTENT ═══ */
const BOSS={
  1:{n:"THE TARIFF",s:"EVERYTHING FROM CHINA NOW COSTS 30% MORE",art:"STAMP",cls:""},
  2:{n:"THE BULLWHIP",s:"EVERYBODY PANICKED AND ORDERED TRIPLE",art:"BOXES",cls:"b3"},
  3:{n:"THE SHUTDOWN",s:"THE PORT IS CLOSED FOR TWO MONTHS",art:"LOCK",cls:"b2"}

function buildHUD(){
  statsEl.innerHTML=STATDEF.map(function(d){
    return '<div class="stat" data-k="'+d.k+'">'+
      '<div class="top">'+spr(d.ic,3)+'<span class="nm">'+d.nm+'</span><span class="vl"></span></div>'+
      '<div class="bar">'+Array.from({length:SEGS},function(){return '<i class="seg"></i>'}).join("")+'</div>'+
      '<div class="pop"></div></div>';
  }).join("");

function statColor(k,v){
  if(k==="cash")   return v>=50?"var(--green)":v>=20?"var(--amber)":"var(--red)";
  if(k==="phones") return v>=80?"var(--green)":v>=50?"var(--amber)":"var(--red)";
  return v<=40?"var(--green)":v<=70?"var(--amber)":"var(--red)";   /* risk: lower is better */
}
function fmt(k,v){
  if(k!=="cash") return Math.round(v)+"%";
  return (v<0?"-$":"$")+Math.abs(Math.round(v));
}
function paintHUD(){
  STATDEF.forEach(function(d){
    const el=statsEl.querySelector('[data-k="'+d.k+'"]'), v=S[d.k], c=statColor(d.k,v);
    el.querySelector(".vl").textContent=fmt(d.k,v);
    el.querySelector(".vl").style.color=c;
    const on=Math.round(Math.max(0,Math.min(1,v/d.max))*SEGS);
    el.querySelectorAll(".seg").forEach(function(s,i){
      s.classList.toggle("on",i<on); s.style.setProperty("--c",c);
    });
  });
  pipsEl.innerHTML=[1,2,3].map(function(r){
    const cur=STEPS[step].r===r;
    const done=STEPS.findIndex(function(s){return s.t==="paths"&&s.r===r})<step;
    return '<i class="pip '+(cur?"cur":done?"on":"")+'"></i>';
  }).join("");
}
const CAPS={cash:[-99,999],phones:[0,100],risk:[0,100]};
function applyDmg(d,delay){
  if(!d) return;
  let any=false,bad=false;
  Object.keys(d).forEach(function(k,idx){
    if(!d[k]) return; any=true;
    const good = k==="risk" ? d[k]<0 : d[k]>0;
    if(!good) bad=true;
    setTimeout(function(){
      S[k]=Math.min(CAPS[k][1],Math.max(CAPS[k][0],S[k]+d[k]));
      paintHUD();
      const el=statsEl.querySelector('[data-k="'+k+'"] .pop');
      el.className="pop go"; el.style.color=good?"var(--green)":"var(--red)";
      el.textContent=(d[k]>0?"+":"-")+(k==="cash"?"$":"")+Math.abs(Math.round(d[k]));
      setTimeout(function(){el.classList.remove("go")},1200);
    },(delay||0)+idx*190);
  });
  if(any) setTimeout(function(){ bad?SFX.hurt():SFX.good() },delay||0);
}

/* ═══ typewriter ═══ */
let TW={t:null,full:"",i:0,el:null,done:true,after:null};
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function nl(s){return esc(s).replace(/\n/g,"<br>")}
function typeInto(el,text,after){
  TW.el=el; TW.full=text; TW.i=0; TW.done=false; TW.after=after||null;
  el.innerHTML='<span class="cursor"></span>';
  clearInterval(TW.t);
  TW.t=setInterval(function(){
    TW.i++;
    if(TW.i%2===0) SFX.blip();
    el.innerHTML=nl(text.slice(0,TW.i))+'<span class="cursor"></span>';
    if(TW.i>=text.length) finishType();
  },20);
}
function finishType(){
  clearInterval(TW.t); TW.done=true;
  if(TW.el) TW.el.innerHTML=nl(TW.full);
  const nx=document.querySelector(".next"); if(nx) nx.classList.remove("hide");
  if(TW.after){ const f=TW.after; TW.after=null; f() }
}

      '<h2>TWO FIXES. VERY DIFFERENT SPEEDS.</h2><div class="ck">'+
      '<div class="h"></div><div class="h">STOCK UP</div><div class="h">CHINA + 1</div>'+
      '<div class="k2">STARTS IN</div><div class="g">DAYS</div><div class="am">YEARS</div>'+
      '<div class="k2">BUYS YOU</div><div class="g">MONTHS</div><div class="am">DECADES</div>'+
      '<div class="k2">FIXES THE RISK?</div><div class="g">NO</div><div class="am">YES</div>'+
      '</div><h1 style="font-size:clamp(16px,3.1vw,50px);line-height:1.35;text-shadow:5px 5px 0 var(--red2)">'+
      'STOCK UP FIRST.<br>THEN <span style="color:var(--amber)">BUILD</span>.</h1>'+
      '<div class="body">Stocking up never lowered your reliance on one country. Not once, all game. '+
      'What it bought you was time, and the only thing worth spending that time on is the fix that takes years.</div>'+
      '<div class="small">JUST-IN-TIME &#8594; JUST-IN-CASE &#183; <b class="blink">PRESS R TO PLAY AGAIN</b></div></div></div>';
  }

  stage.innerHTML=h;
  stage.querySelectorAll("[data-pick]").forEach(function(el){
    el.addEventListener("click",function(e){e.stopPropagation();choose(+el.dataset.pick)});
  });

  if(st.t==="boss"){ SFX.boss(); shake(); typeInto(document.getElementById("tw"),SHOCK[st.r]) }
  if(st.t==="aft"){
    const a=st._a;
    setTimeout(function(){ a.crit?(SFX.crit(),shake(),flash()):SFX.page() },380);
    typeInto(document.getElementById("tw"),a.txt,function(){applyDmg(a.dmg,150)});
  }
  if(st.t==="result"){
    const o=st._o;
    setTimeout(function(){ SFX.page(); if(o.stamp[2]==="sr"){SFX.crit();shake();flash()} },380);
    typeInto(document.getElementById("tw"),o.res,function(){applyDmg(o.dmg,150)});
  }
  if(st.t==="paths") SFX.page();
  if(st.t==="rank"){ const v=grade(); setTimeout(function(){ (v.g==="D"||v.g==="C")?SFX.lose():SFX.win() },300) }
}
function shake(){ rootEl.classList.remove("shake"); void rootEl.offsetWidth; rootEl.classList.add("shake") }
function flash(){ flashEl.classList.remove("flashing"); void flashEl.offsetWidth; flashEl.classList.add("flashing") }

function grade(){
  if(S.quit) return {g:"D",c:"red",t:"YOU SOLD THE COMPANY",
    x:"Your reliance on one country is zero, because you do not make anything anymore. The company that bought you started building a second factory back in year one."};
  const p=posture();
  if(p==="BOTH"&&S.cash>=30&&S.phones>=85&&S.risk<=60) return {g:"S",c:"green",t:"YOU ACTUALLY PULLED IT OFF",
    x:"You stocked up first, which bought you time. Then you spent that time building a second factory. That order is the whole trick, and almost nobody picks it in round one."};
  if(p==="BOTH") return {g:"A",c:"amber",t:"YOU MADE IT. BARELY.",
    x:"You did both of the right things and paid full price for both. You survived, and you are broke. Doing them in the other order would have been cheaper."};
  if(p==="STOCKED") return {g:"B",c:"amber",t:"SAFE FOR NOW, STUCK FOREVER",
    x:"Stocking up kept you alive and it never fixed anything. Same country, same parts, same problem, less money. A stockpile always runs out."};
  if(p==="PLUSONE") return {g:"B",c:"amber",t:"RIGHT IDEA, TERRIBLE TIMING",
    x:"The second factory was the correct call. You just had nothing to sell during the two years it took to build, and customers do not wait two years."};
  return {g:"C",c:"red",t:"OOF",
    x:"No spare parts, no second factory, everything still from one country. You saved money every single round, and it cost you more every single round."};
}

/* ═══ flow ═══ */
function snap(){return JSON.parse(JSON.stringify(S))}
function choose(i){
  const st=STEPS[step]; if(st.t!=="menu") return;
  const o=MENUOPTS[st.r][i];
  S.picks[st.r-1]=i;
  if(o.set) Object.assign(S,o.set);
  SFX.pick();
  const card=stage.querySelector('[data-pick="'+i+'"]');
  if(card){
    card.classList.add("sel");
    stage.querySelectorAll(".cmd").forEach(function(c){ if(c!==card) c.style.opacity=".2" });
  }
  setTimeout(next,340);
}
function next(){
  if(step>=STEPS.length-1) return;
  if(!TW.done){ finishType(); return }
  hist.push({step:step,state:snap()});
  step++;
  try{ draw() }
  catch(err){
    /* never freeze mid-presentation: log it, skip the broken screen */
    console.error("screen failed",STEPS[step],err);
    if(step<STEPS.length-1){ step++; draw() }
  }
}
function back(){
  if(!hist.length) return;
  clearInterval(TW.t); TW.done=true;
  const h=hist.pop(); step=h.step; S=h.state; draw();
}
function reset(){
  clearInterval(TW.t); TW.done=true;
  S=JSON.parse(JSON.stringify(START)); step=0; hist=[];
  STEPS.forEach(function(s){delete s._a;delete s._o});
  draw();
}

document.addEventListener("keydown",function(e){
  const k=e.key;
  if(k===" "||k==="Enter"||k==="ArrowRight"||k==="PageDown"){
    e.preventDefault();
    if(!TW.done){ finishType(); return }
    if(STEPS[step].t!=="menu") next();
    return;
  }
  if(k==="ArrowLeft"||k==="Backspace"||k==="PageUp"){ e.preventDefault(); back(); return }
  if(k>="1"&&k<="4"){ if(!TW.done) finishType(); choose(+k-1); return }
  if(k==="r"||k==="R"){ reset(); return }
  if(k==="m"||k==="M"){
    SND=!SND;
    sndEl.innerHTML=SND?"&#9834; SOUND ON":"&#9834; SOUND OFF";
    sndEl.style.color=SND?"":"#4a4070";
    if(SND) SFX.pick();
    return;
  }
  if(k==="f"||k==="F"){ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen() }
});
document.addEventListener("click",function(e){
  if(e.target.closest("[data-pick]")||e.target.closest("#ctrl")||e.target.closest("#hud")) return;
  if(!TW.done){ finishType(); return }
  if(STEPS[step].t!=="menu") next();
});

/* boot */
(function(){
  const rs=document.documentElement.style;
  rs.setProperty("--dith", tileURL(checkerTile(8), {A:"#1b1432"}));
  rs.setProperty("--haz",  tileURL(stairTile(16,8), {A:"#2b2050"}));
  buildHUD(); reset();
})();
</script>
