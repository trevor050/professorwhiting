name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test (rules, balance, offline build, committed build is fresh)
        run: npm test
      - name: Build
        run: npm run build
      - name: Fail if the build changed tracked files
        run: git diff --exit-code
